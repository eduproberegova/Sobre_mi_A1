<style>
:root{

*{box-sizing:border-box}
html,body{margin:0}

.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 16px}

input.t,textarea.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:18px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.vars{display:flex;gap:8px;flex-wrap:wrap}
.vars label{flex:1 1 70px;border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:700;cursor:pointer;background:#fff}
.vars input{position:absolute;opacity:0;pointer-events:none}
.vars label:has(input:checked){border-color:var(--red);background:var(--red-soft);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-size:17px;background:var(--red);color:#fff;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--ice);color:var(--ink)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--red);font-weight:600;min-height:1.4em;margin:10px 0 0}
details.acc{border-top:1px solid var(--line);padding:10px 0}
details.acc:first-of-type{border-top:0}
details.acc summary{font-weight:700;cursor:pointer}
table.ct{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:15px}
table.ct th,table.ct td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.ct th{background:var(--ice);font-weight:700}
table.ct td:last-child,table.ct th:last-child{text-align:right;white-space:nowrap}
table.ct tr.tot td{font-weight:700;background:var(--red-soft)}
ul.rules{margin:8px 0 0;padding-left:20px}

.thead{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}

.bar{height:5px;background:var(--ice)}

.qwrap{padding-top:22px}

.clock{font:700 26px var(--f-mono);color:var(--ink);min-width:86px;text-align:right}
.clock.warn{color:var(--warn)}
.clock.danger{color:var(--red)}
.instr{color:var(--muted);font-size:15px;margin:0 0 12px}
.q{font-size:21px;line-height:1.5;margin:0 0 6px}

.opt b{font:700 14px var(--f-mono);color:var(--muted);width:22px}
.opt.on{border-color:var(--red);background:var(--red-soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.keys button{min-width:44px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:19px;font-weight:600;touch-action:manipulation;-webkit-user-select:none;user-select:none}

.intro h2{font:800 28px/1.15 var(--f-display);margin:0 0 6px}
.intro .num{font:700 14px var(--f-mono);color:var(--red);letter-spacing:.06em}

.status.bad{background:var(--red-soft);color:var(--red)}

@media print{

const norm=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[’`´]/g,"'").replace(/[¡!¿?.,;:«»"“”()]/g,' ').replace(/\s+/g,' ').trim();
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const noArt=s=>s.replace(/^(el|la|los|las|un|una|unos|unas) /,'');
function gradeText(p,given,answers){
  let g=norm(given); if(!g) return 0;
  let A=answers.map(norm);
  if(p.art){g=noArt(g);A=A.map(noArt)}
  if(A.includes(g)) return p.pts;
  if(A.map(noAcc).includes(noAcc(g))) return p.pts/2;
  return 0;
}
function grade(){
  const res=[]; let auto=0; const per={};
  PARTS.forEach(p=>{per[p.id]=0;
    V[st.v][p.id].forEach((it,i)=>{const k=p.id+'.'+(i+1), g=st.ans[k]; let pts=null, keyTxt='', you='';
      if(p.type==='mc'){you=g===undefined?'':LET[g]+') '+it.o[g]; keyTxt=LET[it.c]+') '+it.o[it.c]; pts=g===it.c?p.pts:0}

      else {you=g||''; keyTxt=it.a.join(' / '); pts=gradeText(p,g,it.a)}
      if(pts!==null){auto+=pts;per[p.id]+=pts}
      res.push({k,p,it,you,keyTxt,pts});
    });
  });
  return {res,auto,per};
}

  L.push(`Estudiante: ${st.name} · Grupo: ${st.group} · Variante: ${st.v}`);
  L.push(`Inicio: ${st.started} · Fin: ${st.ended}`);
  L.push(`Parte automática: ${g.auto} / ${AUTO_MAX} · Traducción: ___ / ${FREE_MAX} (revisa la profesora)`);
  L.push(`Salidas de la página: ${st.hidden}`);
  L.push('');
  PARTS.forEach((p,pi)=>{
    L.push(`— ${pi+1}. ${p.title}` + (p.type==='free'?` (___ / ${maxOf(p)})`:` (${g.per[p.id]} / ${maxOf(p)})`));
    g.res.filter(r=>r.p===p).forEach(r=>{
      const mark=r.pts===null?'[revisar]':r.pts===p.pts?'✓':r.pts>0?'½':'✗';
      L.push(`${r.k} ${mark}${r.pts===null?'':' ('+r.pts+')'} · ${r.it.q}\n    respuesta: ${r.you||'(vacío)'}\n    ${r.pts===null?'modelo':'correcto'}: ${r.keyTxt}`);
    });
    L.push('');
  });
  return L.join('\n');
}
function finish(){
  clearInterval(timer);
  if(!st.finished){st.finished=true; st.ended=new Date().toISOString(); log('Fin de la prueba'); save()}
  const g=grade(); renderResults(g);
  if(!st.sent) send(g);
}
async function send(g){
  const box=$('#status'); const set=(c,t)=>{if(box){box.className='status '+c;box.textContent=t}};
  set('wait','Enviando… No cierre la página.');
  try{
    const fd=new FormData();
    fd.append('_subject',`${META.short} · ${st.name} · V${st.v} · ${g.auto}/${AUTO_MAX}`);
    fd.append('curso',META.course); fd.append('nombre',st.name); fd.append('grupo',st.group); fd.append('variante',String(st.v));
    fd.append('puntos_auto',`${g.auto} / ${AUTO_MAX}`); fd.append('salidas_de_pagina',String(st.hidden));
    fd.append('informe',report(g)); fd.append('diario',st.journal.join('\n'));
    const r=await fetch(CONFIG.FORM_URL,{method:'POST',body:fd,headers:{Accept:'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    st.sent=true; log('Enviado'); save(); set('ok','✓ Enviado. La profesora ha recibido su trabajo.');
    const rb=$('#resend'); if(rb) rb.style.display='none';
  }catch(e){
    log('Error al enviar: '+e.message); save();
    set('bad','No se ha podido enviar. Compruebe internet y pulse «Enviar otra vez». Si no funciona, guarde el PDF y envíelo a la profesora.');
    const rb=$('#resend'); if(rb) rb.style.display='';
  }
}
function renderResults(g){
  const sc=g.res.map(r=>{
    const cls=r.pts===null?'rev':r.pts===r.p.pts?'ok':r.pts>0?'half':'no';
    const mark=r.pts===null?'·':r.pts===r.p.pts?'✓':r.pts>0?'½':'✗';
    const showKey=CONFIG.SHOW_KEY && (r.pts===null || r.pts<r.p.pts);
    return `<div class="it ${cls}"><span class="m">${mark} ${r.k}</span>${esc(r.it.q)}<br><span class="you">Su respuesta: ${esc(r.you||'—')}</span>${showKey?`<br><span class="key">${r.pts===null?'Modelo':'Correcto'}: ${esc(r.keyTxt)}</span>`:''}</div>`;
  }).join('');
  const perRows=PARTS.map((p,i)=>`<tr><td>${i+1}. ${esc(p.title)}</td><td>${p.type==='free'?'— / '+maxOf(p):g.per[p.id]+' / '+maxOf(p)}</td></tr>`).join('');
  app.innerHTML=`
  <header class="top"><div class="wrap"><img class="logo" src="favicon.png" alt="" onerror="this.remove()"><div class="brand">@eduproberegova<small>${esc(META.title)} · ${esc(META.course)}</small></div></div></header>
  <main class="wrap"><h1>Prueba terminada</h1>
    <p class="lead">${esc(st.name)} · ${esc(st.group)} · variante ${st.v}</p>
    <div id="status" class="status wait">Enviando…</div>
    <section class="card">
      <div class="score"><div><b>${g.auto} / ${AUTO_MAX}</b><span>parte automática</span></div><div><b>— / ${FREE_MAX}</b><span>traducción: la revisa la profesora</span></div></div>
      <table class="ct"><tbody>${perRows}</tbody></table>
    </section>
    <div class="btns" style="margin:0 0 16px"><button class="btn" id="resend" style="display:none">Enviar otra vez</button><button class="btn sec" id="pdf">Guardar en PDF</button></div>
    <section class="card"><h3 style="margin:0 0 6px">Sus respuestas</h3>${sc}</section>
  </main>`;
  $('#pdf').onclick=()=>window.print();
  $('#resend').onclick=()=>send(g);
  if(st.sent){const b=$('#status');b.className='status ok';b.textContent='✓ Enviado. La profesora ha recibido su trabajo.'}
}

/* ---------- boot ---------- */
const saved=store.get();
if(saved && saved.v && V[saved.v]){
  st=saved; steps=buildSteps(st.v);
  if(st.finished) finish(); else { log('Página recargada — se continúa'); run(); }
} else startScreen();
})();
</script>
